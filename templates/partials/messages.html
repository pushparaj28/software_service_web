{% if messages %}
  <div class="fixed inset-x-0 top-20 z-[60] mx-auto w-[calc(100%-2.5rem)] max-w-xl space-y-2" role="status" aria-live="polite">
    {% for message in messages %}
      <div class="flash {% if message.tags == 'error' %}error{% endif %} flex items-start justify-between gap-4 px-4 py-3 text-sm backdrop-blur" data-flash>
        <span>{{ message }}</span>
        <button type="button" class="text-ink2 hover:text-ink" data-flash-close aria-label="Dismiss">✕</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
