<header class="site-header fixed inset-x-0 top-0 z-50" data-navbar>
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5 lg:px-8" aria-label="Primary">
    <a href="{% url 'home' %}" class="logo relative z-50" aria-label="CODEMATRIX home">CODE<span>MATRIX</span></a>

    <ul class="hidden items-center gap-8 lg:flex">
      {% for item in nav_items %}
        <li><a href="{% url item.url_name %}" class="nav-link {% if item.active %}is-active{% endif %}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>

    <a href="{% url 'contact' %}" class="btn btn-primary hidden lg:inline-flex">Start Building →</a>

    <button type="button" class="hamburger relative z-50 lg:hidden" data-menu-toggle
            aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu">
      <span></span><span></span>
    </button>
  </nav>
</header>
